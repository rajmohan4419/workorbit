<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- O Gradients -->
    <linearGradient id="dark-o-grad" x1="45" y1="25" x2="115" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="75%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="dark-rim-grad" x1="60" y1="35" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="dark-ring-grad" x1="20" y1="95" x2="140" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#C084FC"/>
      <stop offset="85%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Board Wordmark Gradient -->
    <linearGradient id="dark-board-grad" x1="330" y1="50" x2="550" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="65%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <radialGradient id="dark-sat-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="75%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>

    <mask id="dark-back-ring-mask">
      <rect width="160" height="160" fill="#FFFFFF"/>
      <ellipse cx="80" cy="76" rx="36" ry="43" fill="#000000" transform="rotate(-18 80 76)"/>
    </mask>

    <clipPath id="dark-front-ring-clip">
      <path d="M 0 65 L 160 100 L 140 160 L 0 160 Z"/>
    </clipPath>
  </defs>

  <!-- ==================== SYMBOL / ICON (Left) ==================== -->
  <g transform="translate(10, 5)">
    <!-- Back ring -->
    <g mask="url(#dark-back-ring-mask)">
      <ellipse cx="80" cy="75" rx="68" ry="30" 
        fill="none" 
        stroke="url(#dark-ring-grad)" 
        stroke-width="7" 
        transform="rotate(-28 80 75)"
      />
    </g>

    <!-- Central O -->
    <g transform="rotate(-18 80 76)">
      <path d="M 80 34
               C 101 34, 116 52, 116 76
               C 116 100, 101 118, 80 118
               C 59 118, 44 100, 44 76
               C 44 52, 59 34, 80 34 Z
               M 80 54
               C 69 54, 62 64, 62 76
               C 62 88, 69 98, 80 98
               C 91 98, 98 88, 98 76
               C 98 64, 91 54, 80 54 Z"
            fill="url(#dark-o-grad)"
            fill-rule="evenodd"
      />
      <path d="M 58 46
               C 67 37, 81 35, 94 38
               C 87 41, 74 43, 68 52
               C 63 60, 62 69, 62 76
               C 60 70, 58 60, 58 46 Z"
            fill="url(#dark-rim-grad)"
            opacity="0.85"
      />
    </g>

    <!-- Front ring -->
    <g clip-path="url(#dark-front-ring-clip)">
      <ellipse cx="80" cy="75" rx="68" ry="30" 
        fill="none" 
        stroke="url(#dark-ring-grad)" 
        stroke-width="7" 
        transform="rotate(-28 80 75)"
      />
      <ellipse cx="80" cy="75" rx="68" ry="30" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1.8" 
        stroke-opacity="0.7"
        transform="rotate(-28 80 75)"
      />
    </g>

    <!-- Satellite sphere -->
    <circle cx="129" cy="42" r="9.5" fill="url(#dark-sat-grad)"/>
    <circle cx="127" cy="40" r="2.8" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- ==================== TYPOGRAPHY (Right) ==================== -->
  <!-- "Orbit" (Solid Pure White) -->
  <text x="185" y="94" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
    font-size="62" 
    font-weight="900" 
    letter-spacing="-0.03em" 
    fill="#FFFFFF">Orbit</text>

  <!-- "Board" (Vivid Gradient) -->
  <text x="340" y="94" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
    font-size="62" 
    font-weight="900" 
    letter-spacing="-0.03em" 
    fill="url(#dark-board-grad)">Board</text>

  <!-- Tagline: "PLAN • BUILD • DO • TOGETHER" -->
  <g transform="translate(188, 128)">
    <text x="0" y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
      font-size="12" 
      font-weight="700" 
      letter-spacing="0.32em" 
      fill="#94A3B8">PLAN</text>
    
    <circle cx="68" cy="-4" r="2.5" fill="#38BDF8"/>

    <text x="82" y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
      font-size="12" 
      font-weight="700" 
      letter-spacing="0.32em" 
      fill="#94A3B8">BUILD</text>

    <circle cx="164" cy="-4" r="2.5" fill="#A855F7"/>

    <text x="178" y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
      font-size="12" 
      font-weight="700" 
      letter-spacing="0.32em" 
      fill="#94A3B8">DO</text>

    <circle cx="224" cy="-4" r="2.5" fill="#FB923C"/>

    <text x="238" y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
      font-size="12" 
      font-weight="700" 
      letter-spacing="0.32em" 
      fill="#94A3B8">TOGETHER</text>
  </g>
</svg>

