<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="orb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#ring-grad)" stroke-width="8" stroke-opacity="0.4" fill="none"/>

  <!-- Orbital Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="85" fill="none" stroke="url(#ring-grad)" stroke-width="24" stroke-linecap="round" transform="rotate(-28 256 256)" filter="url(#glow)"/>

  <!-- Central Planet Body -->
  <circle cx="256" cy="256" r="105" fill="#0F172A"/>
  <circle cx="256" cy="256" r="95" fill="url(#ring-grad)" opacity="0.15"/>
  <text x="256" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="200" font-weight="900" fill="#FFFFFF" text-anchor="middle">O</text>

  <!-- Satellite Orb -->
  <circle cx="395" cy="155" r="34" fill="url(#orb-grad)" filter="url(#glow)"/>
  <circle cx="395" cy="155" r="14" fill="#FFF" opacity="0.8"/>
</svg>